<svg xmlns="http://www.w3.org/2000/svg" viewBox="76 68 360 376">
  <!-- Steal a Masterpiece (marque seule, fond transparent) : cadre doré à rosettes, masque de voleur sur toile de velours, éclat d'or, laser -->
  <defs>
    <radialGradient id="wall" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#6e1a2d"/><stop offset=".6" stop-color="#3f0e1a"/><stop offset="1" stop-color="#22080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe4a0"/><stop offset=".28" stop-color="#d9a647"/><stop offset=".55" stop-color="#8f5d18"/>
      <stop offset=".78" stop-color="#e8bb58"/><stop offset="1" stop-color="#a26c1f"/>
    </linearGradient>
    <linearGradient id="goldIn" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f3cf73"/><stop offset=".5" stop-color="#9a661c"/><stop offset="1" stop-color="#e2b456"/>
    </linearGradient>
    <radialGradient id="rose" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff2c2"/><stop offset=".55" stop-color="#e2b04d"/><stop offset="1" stop-color="#7d4f12"/>
    </radialGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47101e"/><stop offset="1" stop-color="#1c060b"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6d6b4"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="22%" r="55%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".16"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="clipCanvas"><rect x="132" y="124" width="248" height="264"/></clipPath>
  </defs>

  <!-- ombre portée du cadre sur le mur -->
  <rect x="98" y="98" width="328" height="344" rx="8" fill="#0d0306" opacity=".55" filter="url(#soft)"/>
  <!-- cadre : moulure extérieure, gorge, filet intérieur -->
  <rect x="92" y="84" width="328" height="344" rx="6" fill="url(#gold)"/>
  <rect x="93.5" y="85.5" width="325" height="341" rx="5" fill="none" stroke="#fff3c4" stroke-opacity=".55" stroke-width="3"/>
  <rect x="112" y="104" width="288" height="304" rx="3" fill="url(#goldIn)"/>
  <rect x="125" y="117" width="262" height="278" fill="#f1cc6c"/>
  <rect x="132" y="124" width="248" height="264" fill="url(#canvas)"/>

  <g clip-path="url(#clipCanvas)">
    <!-- lumière du projecteur sur la toile -->
    <ellipse cx="256" cy="190" rx="130" ry="110" fill="#ff9fb2" opacity=".07"/>
    <!-- laser de sécurité -->
    <line x1="120" y1="352" x2="392" y2="318" stroke="#ff2d55" stroke-width="12" opacity=".55" filter="url(#glow)"/>
    <line x1="120" y1="352" x2="392" y2="318" stroke="#ff8aa0" stroke-width="3"/>
  </g>

  <!-- masque de voleur : ombre, rubans, bandeau percé de deux yeux -->
  <path d="M161 246 C 161 212 205 202 256 220 C 307 202 351 212 351 246 C 351 286 309 298 282 278 C 270 269 242 269 230 278 C 203 298 161 286 161 246 Z" fill="#0d0306" opacity=".5" filter="url(#soft)" transform="translate(0 8)"/>
  <path d="M166 236 C 140 246 128 272 136 304 C 144 280 156 264 176 254 Z" fill="#d9c69f"/>
  <path d="M170 250 C 150 270 150 298 164 322 C 166 296 172 278 186 264 Z" fill="#cbb68c"/>
  <path fill="url(#ivory)" fill-rule="evenodd" d="M161 240 C 161 206 205 196 256 214 C 307 196 351 206 351 240 C 351 280 309 292 282 272 C 270 263 242 263 230 272 C 203 292 161 280 161 240 Z
    M186 244 Q 209 220 238 239 Q 213 262 186 244 Z
    M326 244 Q 303 220 274 239 Q 299 262 326 244 Z"/>
  <path d="M168 230 C 186 210 226 206 256 220 C 286 206 326 210 344 230" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>

  <!-- éclat d'or -->
  <path d="M338 150 L343.5 166.5 L360 172 L343.5 177.5 L338 194 L332.5 177.5 L316 172 L332.5 166.5 Z" fill="#fff4c9"/>
  <circle cx="338" cy="172" r="14" fill="#ffe08a" opacity=".25"/>

  <!-- rosettes d'angle -->
  <g fill="url(#rose)">
    <circle cx="108" cy="100" r="17"/><circle cx="404" cy="100" r="17"/><circle cx="108" cy="412" r="17"/><circle cx="404" cy="412" r="17"/>
  </g>
  <g fill="#7d4f12">
    <circle cx="108" cy="100" r="5.5"/><circle cx="404" cy="100" r="5.5"/><circle cx="108" cy="412" r="5.5"/><circle cx="404" cy="412" r="5.5"/>
  </g>
</svg>
