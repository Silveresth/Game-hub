<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; src: url(../../public/fonts/cinzel-latin.woff2) format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'Bricolage Grotesque'; src: url(../../public/fonts/bricolage-latin.woff2) format('woff2'); font-weight: 200 800; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14040a; }
  body.h { width: 1280px; height: 720px; }

  .stage { position: relative; width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(ellipse 55% 38% at 50% 40%, rgba(255,214,140,.32), transparent 70%),
      radial-gradient(ellipse at 50% 30%, #6a1426 0%, #3d0915 45%, #14040a 100%); }
  /* motif de velours */
  .stage::before { content: ''; position: absolute; inset: 0; opacity: .18;
    background-image: radial-gradient(ellipse 18px 30px at 50% 50%, #ff8aa0 0 40%, transparent 42%);
    background-size: 90px 120px; }
  .shot { position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: url(../promo-video/shots/room.png) center 62% / cover;
    filter: saturate(1.25) brightness(.85);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 45%); }

  /* faisceau du projecteur */
  .beam { position: absolute; left: 50%; top: -5%; width: 900px; height: 1100px; transform: translateX(-50%);
    background: linear-gradient(to bottom, rgba(255,236,190,.35), rgba(255,236,190,0) 85%);
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); filter: blur(6px); }

  .brand { position: absolute; top: 70px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 22px; }
  .brand img { width: 96px; height: 96px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
  .brand span { font: 900 54px/1 Cinzel; letter-spacing: .06em; color: #fbe4a0;
    background: linear-gradient(#fff3c4, #e9bd5a 55%, #a7701f); -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #2a0710) drop-shadow(0 8px 18px rgba(0,0,0,.7)); }

  /* cadre vide */
  .frame { position: absolute; left: 50%; top: 300px; width: 620px; height: 800px; transform: translateX(-50%);
    padding: 46px; border-radius: 10px;
    background: linear-gradient(135deg, #fff2c2, #e2b04d 30%, #7d4f12 50%, #f3cf73 70%, #a7701f);
    box-shadow: 0 0 0 10px #5a3510, 0 40px 80px rgba(0,0,0,.75), 0 0 120px rgba(255,200,110,.35); }
  .frame .inner { width: 100%; height: 100%; border-radius: 4px; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #521020, #22050c 75%);
    box-shadow: inset 0 0 0 6px #3b2412, inset 0 20px 60px rgba(0,0,0,.8); }
  .frame .ghost { position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%);
    font: 900 420px/1 Cinzel; color: rgba(255,220,150,.10); }
  .laser { position: absolute; height: 7px; left: -20%; width: 140%; border-radius: 4px;
    background: #ff2d55; box-shadow: 0 0 10px #ff2d55, 0 0 30px #ff2d55, 0 0 60px rgba(255,45,85,.7); }
  .l1 { top: 610px; transform: rotate(-14deg); }
  .l2 { top: 820px; transform: rotate(11deg); }

  .stamp { position: absolute; left: 50%; top: 640px; transform: translateX(-50%) rotate(-12deg);
    font: 800 190px/1 'Bricolage Grotesque'; letter-spacing: .02em; color: #ff3550;
    padding: 6px 40px 20px; border: 14px solid #ff3550; border-radius: 26px; background: rgba(20,4,10,.35);
    text-shadow: 0 6px 0 #5a0716; box-shadow: 0 0 40px rgba(255,45,85,.5), inset 0 0 30px rgba(255,45,85,.25); }

  .price { position: absolute; top: 1180px; left: 0; right: 0; text-align: center; }
  .price .k { display: block; font: 700 54px/1 'Bricolage Grotesque'; color: #ffe7a8; letter-spacing: .04em;
    text-shadow: 0 4px 0 #14060c, 0 0 20px rgba(0,0,0,.8); }
  .price .v { display: block; margin-top: 10px; font: 800 150px/1 'Bricolage Grotesque';
    background: linear-gradient(#fff3b0, #ffc93c 50%, #c98a14); -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 0 #3b2412) drop-shadow(0 0 30px rgba(255,190,60,.45)); }

  .hook { position: absolute; bottom: 150px; left: 40px; right: 40px; text-align: center;
    font: 800 104px/1.02 'Bricolage Grotesque'; color: #fff;
    -webkit-text-stroke: 14px #14060c; paint-order: stroke fill;
    filter: drop-shadow(0 10px 0 #14060c) drop-shadow(0 0 30px rgba(0,0,0,.8)); }
  .hook em { font-style: normal; background: linear-gradient(#fff3b0, #ffc93c 50%, #e08a10); -webkit-background-clip: text; color: transparent;
    -webkit-text-stroke: 0; }
  .hook .em-wrap { position: relative; display: inline-block; }
  .hook .em-wrap::before { content: attr(data-t); position: absolute; inset: 0; -webkit-text-stroke: 14px #14060c; color: #14060c; z-index: -1; }

  /* ---------- 16:9 ---------- */
  body.h .beam { left: 30%; width: 700px; height: 760px; }
  body.h .brand { top: 40px; left: 640px; right: 30px; justify-content: flex-start; gap: 14px; }
  body.h .brand img { width: 62px; height: 62px; }
  body.h .brand span { font-size: 36px; }
  body.h .frame { left: 70px; top: 60px; transform: none; width: 440px; height: 600px; padding: 34px; }
  body.h .frame .ghost { font-size: 300px; }
  body.h .l1 { top: 300px; left: -5%; width: 70%; transform: rotate(-12deg); }
  body.h .l2 { top: 470px; left: -5%; width: 70%; transform: rotate(9deg); }
  body.h .stamp { left: 290px; top: 300px; font-size: 120px; border-width: 10px; padding: 4px 26px 14px; }
  body.h .shot { left: auto; width: 46%; height: 100%; right: 0; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 40%); filter: saturate(1.2) brightness(.45); }
  body.h .price { top: 150px; left: 600px; right: 30px; text-align: left; }
  body.h .price .k { font-size: 36px; }
  body.h .price .v { font-size: 104px; }
  body.h .hook { left: 600px; right: 30px; bottom: 70px; text-align: left; font-size: 82px; -webkit-text-stroke-width: 11px; }
</style>
</head>
<body>
<div class="stage">
  <div class="shot"></div>
  <div class="beam"></div>
  <div class="brand"><img src="../../public/logo.svg" alt=""><span>STEAL A MASTERPIECE</span></div>
  <div class="frame"><div class="inner"><div class="ghost">?</div></div></div>
  <div class="laser l1"></div><div class="laser l2"></div>
  <div class="stamp">VOLÉE !</div>
  <div class="price"><span class="k">LA JOCONDE</span><span class="v">800 M</span></div>
  <div class="hook">Et si c'était toi<br>le <em>voleur</em> ?</div>
</div>
<script>
  if (location.hash === '#h') document.body.classList.add('h');
</script>
</body>
</html>
